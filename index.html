<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#startBtn {
  display: block;
  transition:
    transform 0.18s cubic-bezier(.4,2,.6,1),
    box-shadow 0.18s;
  animation:
    pulseBtn 1.2s infinite cubic-bezier(.4,0,.6,1);
}

#startBtn:hover,
#startBtn:focus {
  transform: scale(1.09);
  box-shadow:
    0 0 32px 8px #e7baff99,
    0 0 0 2px #fff2;
  outline: none;
}

@keyframes pulseBtn {

  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 #e7baff44;
  }

  60% {
    transform: scale(1.13);
    box-shadow: 0 0 32px 8px #e7baff99;
  }

  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 #e7baff44;
  }
}

#galaxy-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  z-index: 1;
}

#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 40;
}

.error {
  position: fixed;
  inset: auto 10px 70px 10px;
  background: #260015;
  color: #ffd9f7;
  border: 1px solid #ff8ae5;
  border-radius: 10px;
  padding: 10px;
  font: 12px system-ui;
  display: none;
  z-index: 1000;
}

#cartitaBtn {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  padding: 12px 25px;
  border: 1px solid rgba(180,210,255,0.5);
  border-radius: 30px;
  background: rgba(15,30,60,0.78);
  color: #dce9ff;
  font-family: Georgia, serif;
  font-size: 21px;
  cursor: pointer;
  z-index: 50;
  box-shadow:
    0 0 20px rgba(90,130,200,0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: 0.3s;
}

#cartitaBtn:hover {
  transform:
    translateX(-50%)
    scale(1.05);
  box-shadow:
    0 0 30px rgba(130,170,240,0.4);
}

#sobrePantalla {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 30;
  pointer-events: none;
}

.sobre {
  position: relative;
  width: 330px;
  height: 220px;
  background:
    linear-gradient(
      145deg,
      #426ca8,
      #254d86 55%,
      #183965
    );
  border-radius: 7px;
  box-shadow:
    0 20px 50px rgba(0,0,0,0.65),
    0 0 30px rgba(65,110,180,0.35);
  cursor: pointer;
  overflow: visible;
  pointer-events: auto;
  animation:
    aparecerSobre 0.7s ease;
}

@keyframes aparecerSobre {

  from {
    opacity: 0;
    transform:
      scale(0.8)
      translateY(20px);
  }

  to {
    opacity: 1;
    transform:
      scale(1)
      translateY(0);
  }
}

.sobre::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 165px solid transparent;
  border-right: 165px solid transparent;
  border-top: 120px solid #527db8;
  transform-origin: top center;
  transition:
    transform 0.9s ease;
  z-index: 5;
}

.sobre::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 165px solid transparent;
  border-right: 165px solid transparent;
  border-bottom: 120px solid #1e467b;
  z-index: 6;
}

.corazon {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 70px;
  height: 70px;
  transform:
    translate(-50%, -50%);
  background: #17100e;
  z-index: 7;

  clip-path: polygon(
    0% 20%,
    14% 20%,
    14% 8%,
    28% 8%,
    28% 20%,
    42% 20%,
    42% 32%,
    58% 32%,
    58% 20%,
    72% 20%,
    72% 8%,
    86% 8%,
    86% 20%,
    100% 20%,
    100% 55%,
    86% 55%,
    86% 69%,
    72% 69%,
    72% 83%,
    58% 83%,
    58% 97%,
    42% 97%,
    42% 83%,
    28% 83%,
    28% 69%,
    14% 69%,
    14% 55%,
    0% 55%
  );

  animation:
    latido 1.8s infinite ease-in-out;
}

.corazon span {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 54px;
  height: 54px;
  background:
    linear-gradient(
      135deg,
      #ff4b4b 0%,
      #d92f2f 45%,
      #9e2020 100%
    );

  clip-path: polygon(
    0% 22%,
    16% 22%,
    16% 8%,
    30% 8%,
    30% 22%,
    44% 22%,
    44% 35%,
    56% 35%,
    56% 22%,
    70% 22%,
    70% 8%,
    86% 8%,
    86% 22%,
    100% 22%,
    100% 50%,
    86% 50%,
    86% 64%,
    72% 64%,
    72% 78%,
    58% 78%,
    58% 92%,
    42% 92%,
    42% 78%,
    28% 78%,
    28% 64%,
    14% 64%,
    14% 50%,
    0% 50%
  );
}

.corazon span::after {
  content: "";
  position: absolute;
  top: 10px;
  left: 12px;
  width: 10px;
  height: 10px;
  background: #ff7777;
}

@keyframes latido {

  0%,
  100% {
    transform:
      translate(-50%, -50%)
      scale(1);
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.08);
  }
}

.sobre.abierto::before {
  transform:
    rotateX(180deg);
}

.sobre.abierto .corazon {
  opacity: 0;
  transition:
    opacity 0.3s ease;
}

.instruccion {
  margin-top: 35px;
  color: #dce9ff;
  font-family: Georgia, serif;
  font-size: 26px;
  text-shadow:
    0 0 15px rgba(170,200,255,0.35);
  cursor: pointer;
  pointer-events: auto;
  transition: 0.4s;
  animation:
    aparecerTexto 0.7s ease;
}

@keyframes aparecerTexto {

  from {
    opacity: 0;
    transform:
      translateY(10px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}

/* =====================================================
   CARTA PERSONALIZADA
===================================================== */

#carta {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 35;
  pointer-events: none;
}

.cartaContenido {
  position: relative;
  width: min(370px, 88vw);
  max-height: 68vh;
  overflow-y: auto;

  padding:
    48px 38px 55px;

  background:
    linear-gradient(
      135deg,
      rgba(244,232,211,0.98),
      rgba(232,216,191,0.98)
    );

  color: #3a2921;

  text-align: left;

  box-shadow:
    0 20px 55px rgba(0,0,0,0.65),
    0 0 25px rgba(235,205,165,0.12);

  border-radius: 2px;

  pointer-events: auto;

  animation:
    aparecerCarta 0.8s ease;
}

@keyframes aparecerCarta {

  from {
    opacity: 0;
    transform:
      scale(0.85)
      translateY(20px);
  }

  to {
    opacity: 1;
    transform:
      scale(1)
      translateY(0);
  }
}

.cartaContenido::before {
  content: "";
  position: absolute;
  inset: 15px;

  border:
    1px solid #876b57;

  pointer-events: none;
}

.cartaContenido::after {
  content: "";
  position: absolute;
  inset: 22px;

  border:
    1px solid #b79b83;

  pointer-events: none;
}

.contenidoCarta {
  position: relative;
  z-index: 2;

  padding:
    8px 10px;
}

/* TÍTULO CON SAIL */

.cartaContenido h2 {
  margin:
    0 0 25px;

  font-family:
    "Sail",
    cursive;

  font-size: 42px;

  font-weight:
    normal;

  color:
    #3a2921;

  text-align:
    center;

  letter-spacing:
    0.5px;
}

/* TEXTO PRINCIPAL CON CURSIVA VINTAGE */

.poema {
  font-family:
    "Sail",
    cursive;

  font-size:
    25px;

  line-height:
    1.55;

  white-space:
    pre-line;

  text-align:
    left;

  color:
    #3f2d24;

  letter-spacing:
    0.2px;
}

/* FIRMA */

.autor {
  margin-top:
    35px;

  width:
    100%;

  text-align:
    right;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:
    24px;

  font-style:
    italic;

  font-weight:
    600;

  color:
    #3a2921;

  padding-right:
    3px;
}

.presionarCarta {
  margin-top: 20px;
  color: #dce9ff;
  font-family: Georgia, serif;
  font-size: 19px;
  text-shadow:
    0 0 12px rgba(180,210,255,0.4);
  pointer-events: auto;
  cursor: pointer;
}

@media (max-width: 600px) {

  .sobre {
    width: 290px;
    height: 195px;
  }

  .sobre::before {
    border-left-width: 145px;
    border-right-width: 145px;
  }

  .sobre::after {
    border-left-width: 145px;
    border-right-width: 145px;
  }

  .cartaContenido {
    width: 82vw;
    max-height: 70vh;
    padding:
      40px 27px 48px;
  }

  .contenidoCarta {
    padding:
      7px 8px;
  }

  .cartaContenido h2 {
    font-size:
      38px;

    margin-bottom:
      23px;
  }

  .poema {
    font-size:
      23px;

    line-height:
      1.5;
  }

  .autor {
    margin-top:
      30px;

    font-size:
      23px;
  }

}

</style>

<script>

document.addEventListener(
  'DOMContentLoaded',
  function(){

    const modal =
      document.getElementById('startModal');

    const btn =
      document.getElementById('startBtn');

    const music =
      document.getElementById('bgMusic');

    const cartitaBtn =
      document.getElementById('cartitaBtn');

    const sobrePantalla =
      document.getElementById('sobrePantalla');

    const sobre =
      document.getElementById('sobre');

    const instruccion =
      document.getElementById('instruccion');

    const carta =
      document.getElementById('carta');

    const presionarCarta =
      document.getElementById('presionarCarta');

    cartitaBtn.style.display =
      'none';

    btn.addEventListener(
      'click',
      function(){

        modal.style.display =
          'none';

        music.volume = 0.7;

        music.currentTime = 0;

        const playPromise =
          music.play();

        if(
          playPromise !== undefined
        ){

          playPromise.catch(
            ()=>{}
          );

        }

        runGalaxy({
          cinematic:true
        });

        setTimeout(
          function(){

            cartitaBtn.style.display =
              'block';

          },
          800
        );

      }
    );

    cartitaBtn.addEventListener(
      'click',
      function(){

        cartitaBtn.style.display =
          'none';

        sobrePantalla.style.display =
          'flex';

      }
    );

    let estadoSobre = 0;

    sobre.addEventListener(
      'click',
      abrirSobre
    );

    instruccion.addEventListener(
      'click',
      abrirSobre
    );

    function abrirSobre(){

      estadoSobre++;

      if(
        estadoSobre === 1
      ){

        sobre.classList.add(
          'abierto'
        );

        instruccion.textContent =
          'Ay no, ya me dio pena.';

        return;
      }

      if(
        estadoSobre === 2
      ){

        sobrePantalla.style.display =
          'none';

        carta.style.display =
          'flex';

      }

    }

    presionarCarta.addEventListener(
      'click',
      cerrarCarta
    );

    cartaContenido.addEventListener(
      'click',
      cerrarCarta
    );

    function cerrarCarta(e){

      e.stopPropagation();

      carta.style.display =
        'none';

      cartitaBtn.style.display =
        'block';

      estadoSobre = 0;

      sobre.classList.remove(
        'abierto'
      );

      instruccion.textContent =
        'Abrir';

    }

    function runGalaxy(
      opts={}
    ){

      const err =
        document.getElementById('err');

      function showError(msg){

        err.textContent =
          msg;

        err.style.display =
          'block';

      }

      try {

        const test =
          document
            .createElement('canvas')
            .getContext('webgl')
          ||
          document
            .createElement('canvas')
            .getContext(
              'experimental-webgl'
            );

        if(!test){

          throw new Error(
            'Tu navegador no tiene WebGL activo'
          );

        }

      }
      catch(e){

        showError(
          'WebGL parece desactivado. Prueba con Chrome/Edge/Firefox, o habilita aceleración por hardware.'
        );

        return;

      }

      try {

        const canvas =
          document.getElementById(
            'galaxy-canvas'
          );

        const renderer =
          new THREE.WebGLRenderer({
            canvas,
            antialias:true,
            alpha:false
          });

        renderer.setPixelRatio(
          Math.min(
            2,
            window.devicePixelRatio || 1
          )
        );

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.outputEncoding =
          THREE.sRGBEncoding;

        const scene =
          new THREE.Scene();

        const camera =
          new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            2000
          );

        const controls =
          new THREE.OrbitControls(
            camera,
            renderer.domElement
          );

        controls.enableDamping =
          true;

        controls.dampingFactor =
          0.06;

        controls.minDistance =
          10;

        controls.maxDistance =
          220;

        controls.target.set(
          0,
          0,
          0
        );

        let cinematicState =
          opts.cinematic
            ? 0
            : null;

        let cinematicStart =
          null;

        const cinematicDuration1 =
          2.2;

        const cinematicDuration2 =
          3.5;

        const cinematicDuration3 =
          2.2;

        const cinematicTotal =
          cinematicDuration1 +
          cinematicDuration2 +
          cinematicDuration3;

        function setCam(){

          const w =
            window.innerWidth;

          const h =
            window.innerHeight;

          const isMobile =
            w < 768 ||
            w < h;

          camera.fov =
            isMobile
              ? 90
              : 75;

          camera.position.set(
            0,
            isMobile
              ? 26
              : 22,
            isMobile
              ? 110
              : 75
          );

          camera.updateProjectionMatrix();

          controls.update();

        }

        setCam();

        renderer.setClearColor(
          0x000000,
          1
        );

        const explosions = [];

        function spawnExplosion(){

          const geo =
            new THREE.PlaneGeometry(
              60,
              60
            );

          const c =
            document.createElement(
              'canvas'
            );

          c.width =
            c.height =
            256;

          const g =
            c.getContext('2d');

          const grad =
            g.createRadialGradient(
              128,
              128,
              10,
              128,
              128,
              128
            );

          grad.addColorStop(
            0,
            'rgba(255,255,200,0.85)'
          );

          grad.addColorStop(
            0.2,
            'rgba(255,220,120,0.45)'
          );

          grad.addColorStop(
            0.5,
            'rgba(255,180,255,0.18)'
          );

          grad.addColorStop(
            1,
            'rgba(0,0,0,0)'
          );

          g.fillStyle =
            grad;

          g.fillRect(
            0,
            0,
            256,
            256
          );

          const tex =
            new THREE.CanvasTexture(c);

          const mat =
            new THREE.MeshBasicMaterial({
              map:tex,
              transparent:true,
              depthWrite:false,
              blending:
                THREE.AdditiveBlending
            });

          const mesh =
            new THREE.Mesh(
              geo,
              mat
            );

          const angle =
            Math.random() *
            Math.PI *
            2;

          const dist =
            70 +
            Math.random() *
            60;

          mesh.position.set(
            Math.cos(angle) *
              dist,
            (Math.random()-0.5) *
              40,
            Math.sin(angle) *
              dist
          );

          mesh.lookAt(
            0,
            0,
            0
          );

          mesh.material.opacity =
            0.85;

          mesh.userData.life =
            1.0;

          explosions.push(
            mesh
          );

          scene.add(
            mesh
          );

        }

        setInterval(
          function(){

            if(
              Math.random() < 0.85
            ){

              spawnExplosion();

            }

          },
          700
        );

        const galaxy =
          new THREE.Group();

        scene.add(
          galaxy
        );

        const phrases = [

          "Tommy",
          "Thonnn",
          "Melocotón",
          "Azúcar morena",
          "Bonito",
          "Wapo",
          "Feliz día",
          "Hot Wheels",
          "Ojitos lindos",
          "Tu sonrisa",
          "Chiquito",
          "Morenito",
          "boyy",
          "Meloconsito",
          "Dulcito",
          "Bobo",
          "Tonoto",
          "Corazón",
          "Naco",
          "cielito",
          "Corazoncito",
          "Tonito",
          "Tommycito",
          "Niño",
          "Chetitos"

        ];

        const phraseCount =
          Math.max(
            phrases.length * 8,
            240
          );

        const arms = 5;

        const radius = 82;

        const maxH = 22;

        const ringImgs = [

          "https://i.imghippo.com/files/dUaF4992bvo.png",

          "https://i.imghippo.com/files/oGzv1585xEc.png",

          "https://i.imghippo.com/files/zBo8571IgA.png",

          "https://i.imghippo.com/files/hmbF9525A.png",

          "https://i.imghippo.com/files/FpyF7764FFQ.png"

        ];

        function makeTextTexture(
          text,
          size=48
        ){

          const c =
            document.createElement(
              'canvas'
            );

          c.width =
            1024;

          c.height =
            128;

          const g =
            c.getContext('2d');

          g.clearRect(
            0,
            0,
            c.width,
            c.height
          );

          g.font =
            '800 ' +
            size +
            'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial';

          g.textAlign =
            'center';

          g.textBaseline =
            'middle';

          g.shadowColor =
            'rgba(210,140,255,0.95)';

          g.shadowBlur =
            24;

          g.fillStyle =
            'rgba(255,240,255,0.98)';

          g.fillText(
            text,
            c.width/2,
            c.height/2
          );

          return new THREE.CanvasTexture(c);

        }

        function makeImageTexture(
          url,
          cb
        ){

          const img =
            new window.Image();

          img.crossOrigin =
            "anonymous";

          img.onload =
            function(){

              const c =
                document.createElement(
                  'canvas'
                );

              c.width =
                256;

              c.height =
                256;

              const g =
                c.getContext('2d');

              g.clearRect(
                0,
                0,
                256,
                256
              );

              g.filter =
                'contrast(1.25) saturate(1.25)';

              g.drawImage(
                img,
                0,
                0,
                256,
                256
              );

              g.filter =
                'none';

              cb(
                new THREE.CanvasTexture(c)
              );

            };

          img.src =
            url;

        }

        const totalSprites =
          phraseCount;

        const imgCount =
          Math.floor(
            totalSprites * 0.35
          );

        let imgPointer = 0;

        for(
          let i=0;
          i<totalSprites;
          i++
        ){

          const perArm =
            totalSprites /
            arms;

          const ang =
            (i % perArm) *
            (
              Math.PI * 2 /
              perArm
            );

          const armAng =
            Math.floor(
              i / perArm
            ) *
            (
              Math.PI * 2 /
              arms
            );

          const minDist =
            radius * 1.18;

          const maxDist =
            radius * 1.38;

          const dist =
            minDist +
            (
              maxDist -
              minDist
            ) *
            (
              i /
              totalSprites
            );

          const thickness =
            Math.pow(
              1 -
              (
                dist /
                (
                  radius *
                  1.38
                )
              ),
              2
            );

          const x =
            Math.cos(
              ang +
              armAng
            ) *
            dist;

          const z =
            Math.sin(
              ang +
              armAng
            ) *
            dist;

          const y =
            (
              Math.random()-0.5
            ) *
            maxH *
            thickness *
            0.9;

          const isTop =
            y >
            maxH * 0.7;

          const isBottom =
            y <
            -maxH * 0.7;

          if(
            (
              i < imgCount ||
              isTop ||
              isBottom
            )
            &&
            ringImgs.length > 0
          ){

            const imgUrl =
              ringImgs[
                imgPointer %
                ringImgs.length
              ];

            makeImageTexture(
              imgUrl,
              function(tex){

                const spr =
                  new THREE.Sprite(
                    new THREE.SpriteMaterial({
                      map:tex,
                      color:0xffffff,
                      transparent:true,
                      depthWrite:false
                    })
                  );

                spr.position.set(
                  x,
                  y + 10,
                  z
                );

                spr.scale.set(
                  8,
                  8,
                  1
                );

                galaxy.add(
                  spr
                );

              }
            );

            imgPointer++;

          }
          else {

            const text =
              phrases[
                i %
                phrases.length
              ];

            const tex =
              makeTextTexture(
                text,
                48
              );

            const spr =
              new THREE.Sprite(
                new THREE.SpriteMaterial({
                  map:tex,
                  transparent:true,
                  depthWrite:false
                })
              );

            spr.position.set(
              x,
              y,
              z
            );

            spr.scale.set(
              20,
              2.6,
              1
            );

            galaxy.add(
              spr
            );

          }

        }

        const starCount =
          8000;

        const geom =
          new THREE.BufferGeometry();

        const pos =
          new Float32Array(
            starCount * 3
          );

        for(
          let i=0;
          i<starCount;
          i++
        ){

          const ang =
            Math.random() *
            Math.PI *
            2;

          const dist =
            Math.random() *
            radius *
            1.15;

          const y =
            (
              Math.random()-0.5
            ) *
            36 *
            Math.pow(
              1 -
              Math.min(
                dist,
                radius
              ) /
              radius,
              1.5
            );

          pos[i*3] =
            Math.cos(ang) *
            dist;

          pos[i*3+1] =
            y;

          pos[i*3+2] =
            Math.sin(ang) *
            dist;

        }

        geom.setAttribute(
          'position',
          new THREE.BufferAttribute(
            pos,
            3
          )
        );

        galaxy.add(
          new THREE.Points(
            geom,
            new THREE.PointsMaterial({
              color:0xffffff,
              size:0.28,
              transparent:true,
              opacity:0.65,
              blending:
                THREE.AdditiveBlending
            })
          )
        );

        const coreR =
          12;

        const coreTexCanvas =
          document.createElement(
            'canvas'
          );

        coreTexCanvas.width =
          coreTexCanvas.height =
          256;

        const cg =
          coreTexCanvas.getContext(
            '2d'
          );

        const grd =
          cg.createRadialGradient(
            128,
            128,
            10,
            128,
            128,
            128
          );

        grd.addColorStop(
          0,
          '#3a7cff'
        );

        grd.addColorStop(
          0.5,
          '#0a2a6b'
        );

        grd.addColorStop(
          1,
          '#000a2a'
        );

        cg.fillStyle =
          grd;

        cg.arc(
          128,
          128,
          128,
          0,
          Math.PI * 2
        );

        cg.fill();

        const core =
          new THREE.Mesh(
            new THREE.SphereGeometry(
              coreR,
              64,
              64
            ),
            new THREE.MeshPhongMaterial({
              map:
                new THREE.CanvasTexture(
                  coreTexCanvas
                ),
              shininess:60,
              specular:0x7ecbff
            })
          );

        core.renderOrder =
          1;

        scene.add(
          core
        );

        const light =
          new THREE.PointLight(
            0x7ecbff,
            1.2,
            200
          );

        light.position.set(
          0,
          30,
          60
        );

        scene.add(
          light
        );

        let imgMesh =
          null;

        const loader =
          new THREE.TextureLoader();

        loader.load(
          'https://i.imghippo.com/files/jbj6226FI.png',
          function(tex){

            const imgSize =
              coreR * 1.7;

            imgMesh =
              new THREE.Mesh(
                new THREE.PlaneGeometry(
                  imgSize,
                  imgSize
                ),
                new THREE.MeshBasicMaterial({
                  map:tex,
                  transparent:true
                })
              );

            imgMesh.position.set(
              0,
              coreR * 2.1,
              0
            );

            imgMesh.renderOrder =
              2;

            scene.add(
              imgMesh
            );

          }
        );

        const photonRing =
          new THREE.Mesh(
            new THREE.RingGeometry(
              coreR * 1.05,
              coreR * 1.18,
              128
            ),
            new THREE.MeshBasicMaterial({
              color:0xEAAEFF,
              transparent:true,
              opacity:0.95,
              side:
                THREE.DoubleSide
            })
          );

        photonRing.rotation.x =
          -Math.PI / 2;

        photonRing.renderOrder =
          0.5;

        scene.add(
          photonRing
        );

        function makeHaloTexture(
          size=1024,
          inner=0.45
        ){

          const c =
            document.createElement(
              'canvas'
            );

          c.width =
            c.height =
            size;

          const g =
            c.getContext('2d');

          const r =
            size / 2;

          const grd =
            g.createRadialGradient(
              r,
              r,
              r * inner,
              r,
              r,
              r
            );

          grd.addColorStop(
            0.0,
            'rgba(255,200,240,0.45)'
          );

          grd.addColorStop(
            0.35,
            'rgba(220,180,255,0.35)'
          );

          grd.addColorStop(
            0.7,
            'rgba(160,200,255,0.28)'
          );

          grd.addColorStop(
            1,
            'rgba(0,0,0,0)'
          );

          g.fillStyle =
            grd;

          g.fillRect(
            0,
            0,
            size,
            size
          );

          const tex =
            new THREE.CanvasTexture(c);

          tex.needsUpdate =
            true;

          return tex;

        }

        const haloPlane =
          new THREE.Mesh(
            new THREE.PlaneGeometry(
              320,
              320
            ),
            new THREE.MeshBasicMaterial({
              map:
                makeHaloTexture(
                  1024,
                  0.45
                ),
              transparent:true,
              depthWrite:false,
              blending:
                THREE.AdditiveBlending,
              opacity:0.9
            })
          );

        haloPlane.rotation.x =
          -Math.PI / 2;

        haloPlane.renderOrder =
          0.2;

        scene.add(
          haloPlane
        );

        function animate(){

          requestAnimationFrame(
            animate
          );

          const t =
            performance.now() *
            0.001;

          if(
            cinematicState !== null
          ){

            if(
              cinematicStart === null
            ){

              cinematicStart =
                t;

            }

            const elapsed =
              t -
              cinematicStart;

            if(
              elapsed <
              cinematicDuration1
            ){

              const prog =
                elapsed /
                cinematicDuration1;

              camera.position.lerpVectors(
                new THREE.Vector3(
                  0,
                  0,
                  220
                ),
                new THREE.Vector3(
                  0,
                  18,
                  38
                ),
                prog
              );

              camera.lookAt(
                0,
                0,
                0
              );

              controls.enabled =
                false;

            }

            else if(
              elapsed <
              cinematicDuration1 +
              cinematicDuration2
            ){

              const prog =
                (
                  elapsed -
                  cinematicDuration1
                ) /
                cinematicDuration2;

              const angle =
                Math.PI / 2 +
                prog *
                Math.PI *
                2 *
                0.85;

              const camRadius =
                38;

              const y =
                18;

              camera.position.x =
                Math.cos(angle) *
                camRadius;

              camera.position.y =
                y;

              camera.position.z =
                Math.sin(angle) *
                camRadius;

              camera.lookAt(
                0,
                0,
                0
              );

              controls.enabled =
                false;

            }

            else if(
              elapsed <
              cinematicTotal
            ){

              const prog =
                (
                  elapsed -
                  cinematicDuration1 -
                  cinematicDuration2
                ) /
                cinematicDuration3;

              const startAngle =
                Math.PI / 2 +
                Math.PI *
                2 *
                0.85;

              const startRadius =
                38;

              const endRadius =
                220;

              const startY =
                18;

              const endY =
                80;

              const currentRadius =
                startRadius +
                (
                  endRadius -
                  startRadius
                ) *
                prog;

              camera.position.x =
                Math.cos(
                  startAngle
                ) *
                currentRadius;

              camera.position.y =
                startY +
                (
                  endY -
                  startY
                ) *
                prog;

              camera.position.z =
                Math.sin(
                  startAngle
                ) *
                currentRadius;

              camera.lookAt(
                0,
                0,
                0
              );

              controls.enabled =
                false;

            }

            else {

              controls.enabled =
                true;

              cinematicState =
                null;

            }

          }

          galaxy.rotation.y =
            t * 0.05;

          core.rotation.y =
            t * 0.12;

          photonRing.rotation.z =
            t * 0.18;

          haloPlane.rotation.z =
            t * 0.02;

          if(
            imgMesh &&
            camera
          ){

            imgMesh.lookAt(
              camera.position
            );

          }

          for(
            let i =
              explosions.length - 1;

            i >= 0;

            i--
          ){

            const e =
              explosions[i];

            e.material.opacity *=
              0.94;

            e.userData.life -=
              0.018;

            if(
              e.userData.life <=
              0.05
            ){

              scene.remove(e);

              explosions.splice(
                i,
                1
              );

            }

          }

          controls.update();

          renderer.render(
            scene,
            camera
          );

        }

        animate();

        const fx =
          document.getElementById(
            'fx'
          );

        const ctx2 =
          fx.getContext(
            '2d'
          );

        function resizeFx(){

          const dpr =
            Math.min(
              2,
              window.devicePixelRatio || 1
            );

          fx.width =
            Math.floor(
              innerWidth * dpr
            );

          fx.height =
            Math.floor(
              innerHeight * dpr
            );

          fx.style.width =
            innerWidth + 'px';

          fx.style.height =
            innerHeight + 'px';

        }

        addEventListener(
          'resize',
          resizeFx
        );

        resizeFx();

        const DPR =
          Math.min(
            2,
            window.devicePixelRatio || 1
          );

        const hearts = [];

        function spawnHearts(
          x,
          y,
          n=20
        ){

          x *= DPR;

          y *= DPR;

          for(
            let i=0;
            i<n;
            i++
          ){

            const a =
              Math.random() *
              Math.PI *
              2;

            hearts.push({

              x:x,

              y:y,

              vx:
                Math.cos(a) *
                (
                  0.6 +
                  Math.random()*0.8
                ),

              vy:
                -(
                  0.8 +
                  Math.random()*1.2
                ),

              life:1,

              size:
                10 +
                Math.random()*16

            });

          }

        }

        function drawHeart(
          x,
          y,
          size
        ){

          const s =
            size;

          ctx2.save();

          ctx2.translate(
            x,
            y
          );

          ctx2.beginPath();

          ctx2.moveTo(
            0,
            -0.25*s
          );

          ctx2.bezierCurveTo(
            .5*s,
            -.9*s,
            1.4*s,
            -.1*s,
            0,
            .9*s
          );

          ctx2.bezierCurveTo(
            -1.4*s,
            -.1*s,
            -.5*s,
            -.9*s,
            0,
            -.25*s
          );

          const g =
            ctx2.createRadialGradient(
              0,
              0,
              0,
              0,
              0,
              s
            );

          g.addColorStop(
            0,
            'rgba(255,190,220,.95)'
          );

          g.addColorStop(
            1,
            'rgba(255,90,160,0)'
          );

          ctx2.fillStyle =
            g;

          ctx2.fill();

          ctx2.restore();

        }

        let lastTap =
          0;

        addEventListener(
          'click',
          function(e){

            if(
              e.target.closest &&
              (
                e.target.closest(
                  '#cartitaBtn'
                ) ||
                e.target.closest(
                  '#sobrePantalla'
                ) ||
                e.target.closest(
                  '#carta'
                )
              )
            ){

              return;

            }

            const now =
              performance.now();

            if(
              now - lastTap <
              320
            ){

              spawnHearts(
                e.clientX,
                e.clientY,
                20
              );

            }

            lastTap =
              now;

          },
          {
            passive:true
          }
        );

        addEventListener(
          'touchend',
          function(e){

            const now =
              performance.now();

            const t =
              e.changedTouches &&
              e.changedTouches[0];

            if(
              now - lastTap <
              320 &&
              t
            ){

              spawnHearts(
                t.clientX,
                t.clientY,
                20
              );

            }

            lastTap =
              now;

          },
          {
            passive:true
          }
        );

        function loopFx(){

          ctx2.clearRect(
            0,
            0,
            fx.width,
            fx.height
          );

          for(
            let i =
              hearts.length - 1;

            i >= 0;

            i--
          ){

            const h =
              hearts[i];

            h.x +=
              h.vx;

            h.y +=
              h.vy;

            h.vy -=
              0.02;

            h.life -=
              0.015;

            ctx2.globalAlpha =
              Math.max(
                0,
                h.life
              );

            drawHeart(
              h.x,
              h.y,
              h.size
            );

            ctx2.globalAlpha =
              1;

            if(
              h.life <= 0
            ){

              hearts.splice(
                i,
                1
              );

            }

          }

          requestAnimationFrame(
            loopFx
          );

        }

        loopFx();

        window.addEventListener(
          'resize',
          function(){

            camera.aspect =
              window.innerWidth /
              window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
              window.innerWidth,
              window.innerHeight
            );

          }
        );

      }
      catch(e){

        showError(
          'Error cargando la galaxia: ' +
          e.message
        );

        console.error(e);

      }

    }

  }
);

</script>

</body>
</html>
